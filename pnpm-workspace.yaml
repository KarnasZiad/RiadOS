packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency lifecycle scripts by default: only these are allowed to build.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

# Required by `pnpm deploy` to produce self-contained production bundles in Docker builds.
injectWorkspacePackages: true

# Scripts we explicitly do not run: telemetry, and optional native builds of the Docker client.
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - cpu-features
  - protobufjs
  - ssh2
