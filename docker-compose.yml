# Local stack.
#   docker compose up -d                  PostgreSQL and Redis only (run the API with pnpm dev)
#   docker compose --profile app up -d    full stack built from the Dockerfiles
name: riados

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: riados
      POSTGRES_USER: riados_owner
      POSTGRES_PASSWORD: riados_owner
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riados_owner -d riados']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://riados_owner:riados_owner@postgres:5432/riados
      DIRECT_URL: postgresql://riados_owner:riados_owner@postgres:5432/riados
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://riados_api:riados_api@postgres:5432/riados
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CORS_ORIGINS: http://localhost:8080
      # The local stack is served over plain HTTP.
      COOKIE_SECURE: 'false'
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
